<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <header>
        <h3>Registro de usuario</h3>
    </header>
    <main>
        <form action="login.html">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>

            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" placeholder="Ingrese sus apellidos" required>

            <label for="nacimiento">Fecha de nacimiento</label>
            <input type="date" id="nacimiento" name="nacimiento" required>

            <label for="nacionalidad">Nacionalidad</label>
            <input type="text" id="nacionalidad" name="nacionalidad" placeholder="Ejemplo: Chile">

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" placeholder="Anote su dirección">

            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="**" required>

            <button type="submit">Registrarse</button>
        </form>
    </main>
    <footer>
        <p>¿Ya tienes una cuenta?</p> 
        <a href="login.html">Iniciar sesión</a>
    </footer>
</body>
</html>
