<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acta del Partido</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <h1>Marcador Oficial</h1>
    
    <main style="display: flex; justify-content: space-around; text-align: center; margin-top: 50px;">
      
        <section id="panel-local">
            <h2 id="nombre-local">Cargando local...</h2>
            <h1 id="goles-local" style="font-size: 50px;">0</h1>
            <button id="btn-gol-local">+ Anotar Gol</button>
        </section>

      
        <section>
            <h2>VS</h2>
        </section>

    
        <section id="panel-visita">
            <h2 id="nombre-visita">Cargando visita...</h2>
            <h1 id="goles-visita" style="font-size: 50px;">0</h1>
            <button id="btn-gol-visita">+ Anotar Gol</button>
        </section>
    </main>
   <footer style="text-align: center; margin-top: 40px;">
        <button id="btn-terminar" style="background-color: #d9534f; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold;">
            Terminar Partido
        </button>
    </footer>
  
    <script type="module" src="/src/partidos.js"></script>
</body>
</html>
