<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selección de Equipos</title>
  <link rel="stylesheet" href="/src/style.css">
  <!-- [IA] inicio · ia/2026-11-09_daniev29_vistas-partido.md -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- [IA] fin -->
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800">

  <!-- [IA] inicio  · ia/2026-11-09_daniev29_vistas-partido.md -->
  <header class="sticky top-0 z-10 bg-emerald-800 text-white shadow"
          x-data="{ abierto: false }"
          @keydown.escape.window="abierto = false">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between px-4 py-3">
      <a href="dashboard.html" class="text-lg font-bold">⚽ Acta Digital</a>

      <button type="button" aria-label="Abrir menú" aria-controls="menu-principal"
              class="rounded p-2 text-2xl transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-white md:hidden"
              @click="abierto = !abierto" :aria-expanded="abierto">☰</button>

      <nav id="menu-principal" aria-label="Principal" x-cloak
           :class="abierto ? '' : 'max-md:hidden'"
           class="flex w-full flex-col gap-1 pt-3 md:w-auto md:flex-row md:items-center md:gap-2 md:pt-0">
        <a href="dashboard.html"
           class="rounded-lg px-3 py-2 transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-white">Dashboard</a>
        <a href="partido.html" aria-current="page"
           class="rounded-lg bg-emerald-900 px-3 py-2 font-semibold">Nuevo partido</a>
        <a href="historial.html"
           class="rounded-lg px-3 py-2 transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-white">Historial</a>
        <a href="index.html" id="btn-cerrar-sesion"
           class="rounded-lg px-3 py-2 transition hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-white md:ml-4 md:border md:border-white/40">Cerrar sesión</a>
      </nav>
    </div>
  </header>
  <!-- [IA] fin -->

  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-10">
    <h1 class="text-3xl font-bold text-emerald-900">Selecciona los equipos que jugarán</h1>
    <p class="mt-2 text-slate-600">Escribe el nombre del equipo o elígelo de la lista. Los dos equipos deben ser distintos.</p>

    <form id="form-equipos" class="mt-6 space-y-5 rounded-xl bg-white p-6 shadow">
      <div class="grid gap-5 sm:grid-cols-2">
        <div>
          <label for="seleccionar1" class="mb-1 block text-sm font-semibold">Equipo 1 (Local)</label>
          <input type="text" id="seleccionar1" name="equipo1" list="opciones" placeholder="Equipo 1" required
                 autocomplete="off"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 transition focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-200">
        </div>

        <div>
          <label for="seleccionar2" class="mb-1 block text-sm font-semibold">Equipo 2 (Visitante)</label>
          <input type="text" id="seleccionar2" name="equipo2" list="opciones" placeholder="Equipo 2" required
                 autocomplete="off"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 transition focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-200">
        </div>
      </div>

      <datalist id="opciones"></datalist>

      <button type="submit"
              class="w-full rounded-lg bg-emerald-700 px-4 py-2 font-semibold text-white transition hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto sm:px-8">
        Comenzar partido
      </button>
    </form>
  </main>

  <footer class="py-6 text-center text-sm text-slate-500">
    <p>Sistema de Acta Digital para Árbitros de Fútbol</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
